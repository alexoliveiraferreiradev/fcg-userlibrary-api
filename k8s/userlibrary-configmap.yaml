apiVersion: v1
kind: ConfigMap
metadata:
  name: userlibrary-config
data:
  DB_SERVER: sql-service
  DB_PORT: "1433"
  DB_NAME: "Fcg_UserLibraries"
  MONGO_PORT: "27017"
  MONGO_DB_NAME: "fcg_userlibraries"
  MONGO_SERVER: mongo-service
  RABBITMQ_SERVER: rabbitmq-service
  RABBITMQ_PORT: "5672"
  REDIS_SERVER: redis-service
  REDIS_PORT: "6379"
  REDIS_NAME: "FiapCloudGames:" 
  USER_LIBRARY_INTEGRATION_QUEUE: "user-library-created-integration-queue"
  DEACTIVE_USER_INTEGRATION_QUEUE: "user-library-deactived-integration-queue"
  USER_LIBRARY_GAME_CREATED_INTEGRATION_QUEUE: "game-created-library-integration-queue"
  REACTIVE_USER_INTEGRATION_QUEUE: "user-library-game-reactive-integration-queue"
  ENVIRONMENT: "Development"
  JWT_ISSUER: "FiapCloudGames"
  JWT_AUDIENCE: "FiapCloudGamesAudience"