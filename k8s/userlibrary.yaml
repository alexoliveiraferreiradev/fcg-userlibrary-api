apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-user-library-api-deployment
  labels:
    app: fcg-user-library-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fcg-user-library-api
  template:
    metadata:
      labels:
        app: fcg-user-library-api
      annotations:
        autor: Alex O Ferreira
        description: "Deployment do microsservico de Biblioteca do Usuário API do Fiap Cloud Games"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fcg-user-library-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: c-fcg-user-library-api
        image: acrfiapcloudgames.azurecr.io/fcg-userlibrary-api:1.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi" 
        env:
          - name: MongoDatabaseSettings__Host
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: MONGO_SERVER
          - name: MongoDatabaseSettings__Port
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: MONGO_PORT
          - name: MongoDatabaseSettings__DatabaseName
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: MONGO_DB_NAME
          - name: MongoDatabaseSettings__Username    
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: MONGO_USER
          - name: MongoDatabaseSettings__Password    
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: MONGO_PASSWORD
          - name: DatabaseSettings__Host
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: DB_SERVER
          - name: DatabaseSettings__DatabaseName
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: DB_NAME
          - name: DatabaseSettings__Port
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: DB_PORT     
          - name: DatabaseSettings__Username
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_USER
          - name: DatabaseSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_PASS
          - name: ASPNETCORE_ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: ENVIRONMENT
          - name: AzureServiceBus__ConnectionString
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: ServiceBus_Connection
          - name: AzureServiceBus__UserLibraryIntegrationQueue
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: USER_LIBRARY_INTEGRATION_QUEUE
          - name: AzureServiceBus__DeactiveUserIntegrationQueue
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: DEACTIVE_USER_INTEGRATION_QUEUE
          - name: AzureServiceBus__UserLibraryGameCreatedIntegrationQueue
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: USER_LIBRARY_GAME_CREATED_INTEGRATION_QUEUE
          - name: AzureServiceBus__ReactiveUserIntegrationQueue
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: REACTIVE_USER_INTEGRATION_QUEUE
          - name: RedisSettings__Host
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: REDIS_SERVER
          - name: RedisSettings__Port
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: REDIS_PORT
          - name: RedisSettings__InstanceName
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: REDIS_NAME
          - name: RedisSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: REDIS_PASSWORD
          - name: JwtSettings__Issuer
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: JWT_ISSUER
          - name: JwtSettings__Audience
            valueFrom:
              configMapKeyRef:
                name: userlibrary-config
                key: JWT_AUDIENCE
          - name: JwtSettings__Secret
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: JWT_SECRET
        volumeMounts:
          - name: secrets-store
            mountPath: /mnt/secrets
            readOnly: true
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5 
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-kv
        
---
apiVersion: v1
kind: Service
metadata:
  name: svc-fcg-userlibrary-api
spec:
  type: ClusterIP
  selector:
    app: fcg-user-library-api
  ports:
    - port: 8085
      targetPort: 8080        